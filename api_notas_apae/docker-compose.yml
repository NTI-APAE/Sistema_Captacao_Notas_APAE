services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: notas_apae
      POSTGRES_USER: notas_apae
      POSTGRES_PASSWORD: notas_apae
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notas_apae -d notas_apae"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://notas_apae:notas_apae@postgres:5432/notas_apae
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
